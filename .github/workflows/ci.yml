name: Validate reference source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned UI test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Device preview and feature DOM regression tests
        run: npm test
      - name: Install syntax tools
        run: sudo apt-get update && sudo apt-get install -y ruby lua5.1 nftables
      - name: Ruby syntax and pure import planning tests
        run: |
          for file in router/phone-dns/*.rb tests/*.rb; do ruby -c "$file"; done
          for file in tests/test-*.rb; do ruby "$file"; done
      - name: Shell and Lua syntax
        run: |
          sh -n scripts/install.sh
          sh -n scripts/maintenance.sh
          sh -n scripts/install-deps.sh
          sh -n router/phone-dns/phone-dns.init
          sh -n router/phone-dns/phone-panel-monitor.init
          sh -n router/phone-dns/phone-panel-guard.init
          sh -n router/openclash/phone-routing.sh
          ruby -c scripts/hooks.rb
          luac5.1 -p router/luci/controller/phone_panel.lua
          luac5.1 -p router/luci/model/cbi/phone_panel_settings.lua
          luac5.1 -p router/phone-dns/probe-dns.lua
          luac5.1 -p router/phone-dns/probe-udp.lua
      - name: Independent guard in an isolated network namespace
        run: sudo env PHONE_PANEL_NFT_TEST=1 unshare --net ruby tests/guard-netns.rb
      - name: Generated DNS configurations with pinned sing-box
        run: |
          curl -fL --proto '=https' --proto-redir '=https' --max-time 90 -o "$RUNNER_TEMP/sing-box.tar.gz" https://github.com/SagerNet/sing-box/releases/download/v1.12.0/sing-box-1.12.0-linux-amd64.tar.gz
          echo "f59b1253ae0143997cb46915af30d14a33431dcbd7e39edacfcde8d73050faaf  $RUNNER_TEMP/sing-box.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP"
          ruby tests/check-dns-config.rb "$RUNNER_TEMP/sing-box-1.12.0-linux-amd64/sing-box"
      - name: Publication privacy gate
        run: python3 scripts/privacy_check.py
      - name: Isolated maintenance backup and restore
        run: python3 tests/test-maintenance.py

      - name: Windows ZIP and opkg payload validation
        run: python3 tests/test-package.py
